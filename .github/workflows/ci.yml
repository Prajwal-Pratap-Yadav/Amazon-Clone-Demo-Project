name: Storefront quality
on:
  push:
    branches: [main, portfolio-overhaul]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storefront-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          cache: npm
      - run: make setup-ci lint typecheck test build docs
      - run: npx playwright install --with-deps chromium --no-shell
      - run: npm run test:e2e
      - run: make reproduce
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: storefront-verification
          path: reports/local/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          cache: npm
      - run: make setup-ci security
  evidence:
    if: github.event_name == 'push' && github.ref == 'refs/heads/portfolio-overhaul' && github.repository == 'Prajwal-Pratap-Yadav/Amazon-Clone-Demo-Project'
    needs: [verify, security]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: storefront-verification
          path: evidence-download
      - name: Preserve actual measurements on the reviewed branch
        run: |
          set -euo pipefail
          write_ok() { test "$GITHUB_REPOSITORY" = 'Prajwal-Pratap-Yadav/Amazon-Clone-Demo-Project'; test "$GITHUB_REF" = 'refs/heads/portfolio-overhaul'; }
          write_ok
          if test -f reports/after/audit/manifest.json; then
            source_sha=$(python -c "import json; print(json.load(open('reports/after/audit/manifest.json'))['sourceSha'])")
            if git diff "$source_sha" HEAD --quiet -- src public index.html package-lock.json scripts/audit.mjs scripts/capture.mjs scripts/reproduce.mjs configs tests playwright.config.ts; then
              echo 'Application and browser suite unchanged; retain measured source.'
              exit 0
            fi
          fi
          test "$(git ls-remote origin refs/heads/portfolio-overhaul | cut -f1)" = "$GITHUB_SHA"
          mkdir -p reports/after
          cp -r evidence-download/reproduced/. reports/after/
          cp evidence-download/e2e.json reports/after/e2e.json
          cp evidence-download/unit.json reports/after/unit.json
          python scripts/install_gitleaks.py
          .tools/gitleaks dir reports/after --redact
          git config user.name 'Prajwal Pratap Yadav'
          git config user.email 'prajwalpratapyadav5@gmail.com'
          git add reports/after
          git commit -m 'test: preserve measured storefront quality and browser captures'
          test "$(git show -s --format='%an <%ae> | %cn <%ce>')" = 'Prajwal Pratap Yadav <prajwalpratapyadav5@gmail.com> | Prajwal Pratap Yadav <prajwalpratapyadav5@gmail.com>'
          write_ok
          git push origin HEAD:refs/heads/portfolio-overhaul

  release_policy:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.policy.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: policy
        name: Preserve published versions during maintenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import tomllib
          import urllib.error
          import urllib.request
          from pathlib import Path

          source = Path("package.json")
          if source.suffix == ".json":
              version = json.loads(source.read_text())["version"]
          else:
              version = tomllib.loads(source.read_text())["project"]["version"]
          if not isinstance(version, str) or not re.fullmatch(r"[0-9][0-9A-Za-z.+-]{0,79}", version):
              raise SystemExit("Invalid project release version")
          url = f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/releases/tags/v{version}'
          request = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  published = not json.load(response).get("draft", False)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise SystemExit(f"Release policy lookup failed: HTTP {error.code}") from None
              published = False
          publish = str(not published).lower()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"publish={publish}\n")
          print(f"v{version}: " + ("published release preserved" if published else "eligible for normal release gates"))
          PY

  release:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Prajwal-Pratap-Yadav/Amazon-Clone-Demo-Project') && needs.release_policy.outputs.publish == 'true'
    needs: [verify, security, release_policy]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          cache: npm
      - run: make setup-ci build
      - run: python scripts/package_release.py
      - name: Record roadmap milestone
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_community.py
      - name: Tag exact verified main and publish preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          write_ok() { test "$GITHUB_REPOSITORY" = 'Prajwal-Pratap-Yadav/Amazon-Clone-Demo-Project'; test "$GITHUB_REF" = 'refs/heads/main'; }
          write_ok
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          tag="v$version"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'Prajwal Pratap Yadav'
          git config user.email 'prajwalpratapyadav5@gmail.com'
          if git rev-parse "$tag^{commit}" >/dev/null 2>&1; then
            test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
          else
            git tag -a "$tag" "$GITHUB_SHA" -m "Everyday storefront $version engineering preview"
            write_ok
            git push origin "refs/tags/$tag"
          fi
          if gh release view "$tag" --repo Prajwal-Pratap-Yadav/Amazon-Clone-Demo-Project >/dev/null 2>&1; then
            echo 'Existing release is attached to the verified tag.'
          else
            write_ok
            gh release create "$tag" --repo Prajwal-Pratap-Yadav/Amazon-Clone-Demo-Project --verify-tag --prerelease --title "Everyday storefront $version engineering preview" --notes-file docs/RELEASE.md reports/local/release/*.zip reports/local/release/SHA256SUMS
          fi
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Prajwal-Pratap-Yadav/Amazon-Clone-Demo-Project'
    needs: [verify, security]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          cache: npm
      - run: make setup-ci build
      - name: Guard current source
        run: |
          test "$GITHUB_REPOSITORY" = 'Prajwal-Pratap-Yadav/Amazon-Clone-Demo-Project'
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - id: activation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/configure_pages.py
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        if: steps.activation.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: steps.activation.outputs.ready == 'true'
        with:
          path: dist
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        if: steps.activation.outputs.ready == 'true'
        id: deployment
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: pages-activation-status
          path: reports/local/pages-status.json
          if-no-files-found: error
